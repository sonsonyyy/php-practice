name: CI

on:
  push:
    branches: [main]

jobs:
  # Job 1: Check code style
  lint:
    # Use the latest Ubuntu Linux virtual machine provided by GitHub
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone your repository code using v5 to avoid Node.js deprecation warnings
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Install PHP 8.4 and inject PHP_CodeSniffer globally
      - name: Setup PHP 8.4 with PHPCS
        uses: shivammathur/setup-php@v2
        with:
          # Match your project's PHP version
          php-version: '8.4'
          # Disable Xdebug to make the setup process significantly faster
          coverage: none
          # Installs phpcs globally so you do not waste time running "composer install" in this job
          tools: phpcs

      # Step 3: Run the code style check strictly on the src folder
      - name: Check Style
        # Running "phpcs src" ensures it only scans your source code and skips everything else
        run: phpcs src

  # Job 2: Run PHPStan static analysis
  static-analysis:
    # Use the latest Ubuntu Linux virtual machine provided by GitHub
    runs-on: ubuntu-latest
    steps:
      # Step 1: Clone your repository code into the virtual machine
      - name: Checkout code
        uses: actions/checkout@v5

      # Step 2: Install and configure the correct PHP environment
      - name: Setup PHP 8.4 with Composer Cache
        uses: shivammathur/setup-php@v2
        with:
          # Match project's PHP version
          php-version: '8.4'
          # Disable Xdebug to make the setup process significantly faster
          coverage: none
          # Enable automated global caching for Composer packages to speed up builds
          tools: composer:v2 # Enables native, automatic dependency caching

      # Step 3: Install all third-party PHP packages required by your application
      - name: Install Dependencies
        # --prefer-dist: Downloads fast zip archives instead of slow Git histories
        # --no-progress: Hides messy download bars from cluttering the log files
        # --no-interaction: Stops the job from freezing if a package prompts for input
        run: composer install --prefer-dist --no-progress --no-interaction

      # Step 4: Run the actual PHPStan scanner to check your code logic and types
      - name: Run PHPStan
        # Executes PHPStan. It returns code 0 on success, or code 1 to fail the build if bugs are found
        run: vendor/bin/phpstan analyse
